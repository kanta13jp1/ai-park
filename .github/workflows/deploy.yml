name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]
  # AI勉強会アジェンダ用の状況ファイル（park-status.json）を最新に保つため、Issue の変化でも再デプロイする
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Deployment Quality Gate (Verify Feature Status)
        run: npm run check:gate

      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build --webpack
        env:
          NODE_ENV: production

      # Google Apps Script から GitHub API を直接呼ぶと共有 IP の上限（403）に当たるため、
      # 公開 Issue の一覧をサイトの静的ファイルとして出しておく（test ラベルは除外）
      - name: Export park status for the agenda script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues?state=open&per_page=100&sort=created&direction=desc" \
            | jq '[.[] | select(.pull_request | not) | select([.labels[].name] | index("test") | not)
                   | {number, title, labels: [.labels[] | {name}]}]' > out/park-status.json
          echo "open issues: $(jq length out/park-status.json)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
