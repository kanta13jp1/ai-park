name: Notify Google Chat on AI Park issues

on:
  issues:
    types: [opened, closed, reopened, labeled]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      contains(github.event.issue.labels.*.name, 'feedback') ||
      contains(github.event.issue.labels.*.name, 'interview') ||
      contains(github.event.issue.labels.*.name, 'ai-project')
    runs-on: ubuntu-latest
    steps:
      - name: Post to Google Chat
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          TITLE: ${{ github.event.issue.title }}
          NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ACTOR: ${{ github.actor }}
          IS_INTERVIEW: ${{ contains(github.event.issue.labels.*.name, 'interview') }}
          IS_PROJECT: ${{ contains(github.event.issue.labels.*.name, 'ai-project') }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "GOOGLE_CHAT_WEBHOOK_URL が未設定のため通知をスキップします"
            exit 0
          fi
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/ai-park"
          if [ "$IS_PROJECT" = "true" ]; then KIND=project; PAGE="$SITE/ai-projects"
          elif [ "$IS_INTERVIEW" = "true" ]; then KIND=interview; PAGE="$SITE/interviews"
          else KIND=feedback; PAGE="$SITE/feedback-todo"; fi

          case "$KIND:$ACTION" in
            project:opened)     HEAD="🏢 社内AIプロジェクトが登録されました" ;;
            project:closed)     HEAD="🏁 社内AIプロジェクトが終了しました" ;;
            interview:opened)   HEAD="🎤 AI活用インタビューへの取材立候補がありました" ;;
            interview:closed)   HEAD="✅ 取材立候補の対応が完了しました" ;;
            feedback:opened)    HEAD="📥 新しいご意見が起票されました" ;;
            feedback:closed)    HEAD="✅ ご意見への対応が完了しました" ;;
            feedback:reopened)  HEAD="🔁 ご意見が再オープンされました" ;;
            feedback:labeled)
              if [ "$LABEL" = "status:in-progress" ]; then HEAD="🚧 ご意見への対応を開始しました"
              else echo "通知対象外のラベル: $LABEL"; exit 0; fi ;;
            *) echo "通知対象外のイベント: $KIND:$ACTION"; exit 0 ;;
          esac

          TEXT=$(printf '%s\n*#%s %s*\n%s\n(by %s) ページ: %s' "$HEAD" "$NUMBER" "$TITLE" "$ISSUE_URL" "$ACTOR" "$PAGE")
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sSf -X POST -H 'Content-Type: application/json; charset=UTF-8' --data @- "$WEBHOOK_URL"
