name: 社内AIプロジェクト登録
description: 社内で進行中・検討中のAI活用プロジェクトを登録します（社内AIプロジェクト一覧に自動掲載されます）
title: "[AIプロジェクト] "
labels: ["ai-project"]
body:
  - type: markdown
    attributes:
      value: |
        このリポジトリは公開されています。顧客名・案件の契約情報・社外秘の数値は書かず、社内向けに共有できる概要のみご記入ください。
        状況が変わったら、この Issue を編集して「状況」を更新してください。プロジェクトが終わったら Close してください。
  - type: input
    id: dept
    attributes:
      label: 部署 / チーム
      placeholder: 例: クラウド開発部
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 担当者（窓口）
      placeholder: 例: 山田（チャットで気軽に声をかけてOKな人）
  - type: dropdown
    id: stage
    attributes:
      label: 状況
      options:
        - 検討中
        - PoC中
        - 本番運用中
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: 使っているAIツール
      placeholder: 例: Antigravity, Gemini, Dify
  - type: textarea
    id: summary
    attributes:
      label: 何をしているか（概要）
      placeholder: 例: 問い合わせメールの一次回答案をAIで作成し、担当者が確認して送信
    validations:
      required: true
  - type: textarea
    id: effect
    attributes:
      label: 成果・現在の課題
      placeholder: 例: 回答作成時間が半分に。社内FAQの整備が課題
